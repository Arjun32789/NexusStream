<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#09090b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>NexusStream — Movies, TV, Anime & Manga</title>
<style>
:root{
  --bg:#09090b;--bg-2:#111113;--panel:#18181b;--panel-2:#202024;
  --line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.12);
  --text:#fafafa;--muted:#a1a1aa;--muted-2:#71717a;
  --accent:#ffffff;--accent-2:#a78bfa;--accent-3:#22d3ee;
  --radius:12px;--radius-lg:18px;
  --shadow:0 4px 24px -4px rgba(0,0,0,.7);
  --shadow-lg:0 20px 60px -20px rgba(0,0,0,.9);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --header:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior-y:contain}
body{
  background:var(--bg);color:var(--text);
  font-family:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(72px + var(--safe-bottom));
  -webkit-user-select:none;user-select:none;touch-action:pan-y;
}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;min-height:44px}
input,select{font:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{display:none}

.topnav{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:14px;
  padding:calc(12px + var(--safe-top)) 18px 12px;
  background:rgba(9,9,11,.85);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--line);
}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-weight:900;font-size:16px;color:#09090b;
  background:linear-gradient(135deg,#fff,var(--accent-2));
  box-shadow:0 0 22px rgba(167,139,250,.4);
}
.logo-name{font-size:17px;font-weight:800;letter-spacing:-.4px}
.logo-name em{font-style:normal;color:var(--accent-2)}
.nav-actions{display:flex;align-items:center;gap:4px;margin-left:auto}
.icon-btn{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:17px;color:var(--muted);transition:.15s}
.icon-btn:hover{background:var(--panel);color:var(--text)}
.icon-btn:active{transform:scale(.92)}

.search-inline{flex:1;max-width:420px;position:relative;margin:0 8px}
@media (max-width:640px){.search-inline{display:none}}
.search-inline input{width:100%;padding:10px 14px 10px 40px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:13.5px;outline:none;transition:.2s}
.search-inline input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(167,139,250,.12);background:var(--panel-2)}
.search-inline .sicon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.4;pointer-events:none}

main{padding-bottom:20px}

.hero{position:relative;min-height:520px;display:flex;align-items:flex-end;padding:32px 24px 36px;overflow:hidden;margin-bottom:8px}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,var(--bg) 4%,rgba(9,9,11,.35) 45%,rgba(9,9,11,.7) 100%)}
.hero-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center 30%;filter:brightness(.62) saturate(1.05)}
.hero-inner{max-width:680px;position:relative;z-index:2;animation:fade .5s ease both}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.pill{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;background:rgba(255,255,255,.12);border:1px solid var(--line-2);backdrop-filter:blur(8px)}
.pill.accent{background:linear-gradient(135deg,var(--accent-2),#8b5cf6);border-color:transparent;color:#fff}
.pill.star{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.3);color:#fbbf24}
.hero h1{font-size:clamp(28px,4.5vw,48px);line-height:1.05;font-weight:900;letter-spacing:-1.5px;margin-bottom:14px;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.hero p{color:#c8c8d0;font-size:15px;line-height:1.65;margin-bottom:22px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:560px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.hero-actions .btn{padding:13px 26px;font-size:15px;border-radius:12px}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.row-section{margin-bottom:32px}
.row-head{display:flex;align-items:center;justify-content:space-between;padding:0 24px;margin-bottom:14px}
.row-head-left{display:flex;flex-direction:column;gap:3px}
.row-kicker{font-size:10.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent-2)}
.row-kicker.hist{color:var(--accent-3)}
.row-title{font-size:19px;font-weight:800;letter-spacing:-.4px;color:var(--text)}
.row-sub{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:500}
.row-nav{display:flex;gap:6px}
.row-nav-btn{width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--muted);transition:.15s}
.row-nav-btn:hover{background:var(--panel-2);color:var(--text);border-color:var(--line-2)}
.row-nav-btn:active{transform:scale(.92)}

.row-scroll{display:flex;gap:14px;overflow-x:auto;padding:4px 24px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}

.card{flex-shrink:0;width:150px;cursor:pointer;scroll-snap-align:start;animation:rise .35s ease both;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.card:active{transform:scale(.96)}
.card-poster{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:linear-gradient(150deg,var(--panel),#0a0a0a);border:1px solid var(--line);box-shadow:0 4px 16px -8px rgba(0,0,0,.8)}
.card-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.card:hover .card-poster img{transform:scale(1.06)}
.card:hover .card-poster{border-color:var(--accent-2);box-shadow:0 8px 28px -12px rgba(167,139,250,.4)}
.card-initials{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:900;color:#fff;opacity:.25}
.card-badge{position:absolute;top:8px;left:8px;z-index:2;padding:3px 7px;border-radius:5px;font-size:9.5px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;background:rgba(0,0,0,.75);border:1px solid var(--line-2);backdrop-filter:blur(6px);color:#fff}
.card-badge.movie{background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-color:transparent}
.card-badge.tv{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:transparent}
.card-badge.anime{background:linear-gradient(135deg,#ec4899,#be185d);border-color:transparent}
.card-badge.manga{background:linear-gradient(135deg,#22c55e,#15803d);border-color:transparent}
.card-badge.indian{background:linear-gradient(135deg,#ff9933,#138808);border-color:transparent}
.card-rating{position:absolute;top:8px;right:8px;z-index:2;display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:5px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);font-size:11px;font-weight:800;color:#fbbf24}
.card-rating::before{content:"★";font-size:10px}
.card-progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15);z-index:2}
.card-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent-3))}
.card-title{margin-top:9px;font-size:13.5px;font-weight:700;line-height:1.25;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:500;display:flex;gap:6px;align-items:center}

/* ── History Badge ── */
.history-time{position:absolute;bottom:8px;left:8px;right:8px;z-index:2;padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:10px;font-weight:800;color:var(--accent-3);text-align:center;text-transform:uppercase;letter-spacing:.6px;border:1px solid rgba(34,211,238,.25)}
.card.history-card .card-poster{border-color:rgba(34,211,238,.2)}
.card.history-card:hover .card-poster{border-color:var(--accent-3);box-shadow:0 8px 28px -12px rgba(34,211,238,.4)}

.grid{display:grid;gap:16px 14px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));padding:0 24px 30px}
.grid .card{width:100%;flex-shrink:1}

.skeleton{aspect-ratio:2/3;border-radius:var(--radius);background:linear-gradient(90deg,var(--panel),#22222a,var(--panel));background-size:200% 100%;animation:shimmer 1.4s infinite}
.skeleton-row{display:flex;gap:14px;padding:0 24px 12px;overflow:hidden}
.skeleton-row .skeleton{width:150px;flex-shrink:0}

.empty{text-align:center;padding:80px 24px;color:var(--muted);background:var(--panel);border:1px dashed var(--line-2);border-radius:var(--radius-lg);margin:0 24px}
.empty .big{font-size:56px;display:block;margin-bottom:16px;opacity:.3}
.empty strong{display:block;font-size:18px;color:var(--text);margin-bottom:8px;font-weight:800}
.empty p{font-size:13.5px;line-height:1.6;max-width:360px;margin:0 auto 20px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:11px;font-size:14px;font-weight:700;transition:.15s;border:1px solid transparent}
.btn:active{transform:scale(.96)}
.btn.primary{background:#fff;color:#09090b;box-shadow:0 4px 20px -8px rgba(255,255,255,.4)}
.btn.primary:hover{background:#e4e4e7}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;border-color:var(--line-2);backdrop-filter:blur(8px)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.accent{background:linear-gradient(135deg,var(--accent-2),#7c3aed);color:#fff;box-shadow:0 8px 24px -10px var(--accent-2)}
.btn.accent:hover{filter:brightness(1.1)}
.btn.danger{background:#ef4444;color:#fff}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:9px}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:80;
  background:rgba(9,9,11,.96);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--line);
  padding:8px 0 calc(10px + var(--safe-bottom));
  display:flex;justify-content:space-around;align-items:center;
}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--muted-2);padding:6px 4px;flex:1;transition:.15s;min-width:0}
.bn-item:active{transform:scale(.9)}
.bn-item.active{color:var(--text)}
.bn-item.active .ic{color:var(--accent-2);filter:drop-shadow(0 0 8px rgba(167,139,250,.5))}
.bn-item .ic{font-size:21px;line-height:1;transition:.15s}
.bn-item .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.overlay{position:fixed;inset:0;z-index:200;display:none;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);overflow-y:auto;overscroll-behavior:contain;animation:fade .2s ease both}
.overlay.open{display:block}
.close-btn{position:fixed;top:calc(16px + var(--safe-top));right:16px;z-index:210;width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.12);border:1px solid var(--line-2);display:grid;place-items:center;font-size:17px;color:#fff;backdrop-filter:blur(12px);transition:.2s}
.close-btn:hover{background:rgba(255,255,255,.2);transform:rotate(90deg)}

.modal-shell{max-width:960px;margin:0 auto;background:var(--bg-2);border:1px solid var(--line-2);border-radius:0;overflow:hidden;box-shadow:var(--shadow-lg);animation:rise .3s ease both}
@media (min-width:720px){.overlay{padding:60px 40px}.modal-shell{border-radius:var(--radius-lg)}}
.modal-hero{position:relative;padding:50px 34px 34px;min-height:320px;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center}
.modal-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg-2) 4%,rgba(17,17,19,.5) 55%,transparent 100%)}
.modal-hero > *{position:relative;z-index:2}
.modal-hero h2{font-size:clamp(24px,3.5vw,36px);font-weight:900;letter-spacing:-1.2px;line-height:1.1;margin-bottom:12px}
.modal-hero .pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.modal-body{padding:28px 34px 34px}
.modal-desc{color:#b8b8c0;line-height:1.75;font-size:14.5px;margin-bottom:22px}
.genre-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:24px}
.genre-chip{padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.06);border:1px solid var(--line-2);color:#d0d0d8}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap}

.player-shell{position:fixed;inset:0;background:#000;z-index:200;overflow-y:auto;overscroll-behavior:contain;padding-top:var(--safe-top)}
.video-stage{position:relative;aspect-ratio:16/9;background:#000;border-bottom:1px solid var(--line)}
.video-stage iframe,.video-stage video,.video-stage .archive-embed{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;z-index:1}
.load-hint{position:absolute;inset:0;z-index:2;display:none;place-items:center;background:rgba(0,0,0,.88);text-align:center;padding:24px}
.load-hint.show{display:grid}

.player-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:18px 24px;background:var(--bg-2);border-bottom:1px solid var(--line)}
.pm-title{font-size:19px;font-weight:800;margin-bottom:5px}
.pm-sub{font-size:13px;color:var(--muted);line-height:1.5}
.pm-actions{display:flex;gap:8px;flex-wrap:wrap}

.lang-tabs{display:flex;gap:6px;padding:14px 20px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.lang-tabs::-webkit-scrollbar{display:none}
.lang-tab{padding:9px 16px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--line);white-space:nowrap;transition:.15s;flex-shrink:0}
.lang-tab.active{background:var(--accent-2);color:#fff;border-color:transparent}

.ep-nav{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);justify-content:center;flex-wrap:wrap}
.ep-input{width:64px;padding:10px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);text-align:center;outline:none;font-weight:800;font-size:14px}
.ep-input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(167,139,250,.15)}

.servers-wrap{padding:18px 24px;background:var(--bg-2);border-bottom:1px solid var(--line)}
.servers-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13.5px;font-weight:800}
.servers-head .hint{font-size:11.5px;color:var(--muted);font-weight:600}
.servers-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.servers-list::-webkit-scrollbar{display:none}
.server-btn{display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:700;white-space:nowrap;transition:.15s;flex-shrink:0}
.server-btn:hover{color:var(--text);background:rgba(255,255,255,.1)}
.server-btn.active{background:var(--accent-2);color:#fff;border-color:transparent}

.fab{position:fixed;bottom:calc(84px + var(--safe-bottom));right:16px;z-index:75;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--accent-2),#7c3aed);display:grid;place-items:center;font-size:20px;color:#fff;box-shadow:0 10px 30px rgba(167,139,250,.5);transition:.2s}
.fab:active{transform:scale(.9)}

.wl-panel{position:fixed;bottom:0;left:0;right:0;z-index:90;max-height:78vh;overflow-y:auto;background:var(--bg-2);border-radius:22px 22px 0 0;border-top:1px solid var(--line-2);padding:16px 20px calc(16px + var(--safe-bottom));display:none;animation:slideUp .25s cubic-bezier(.2,.9,.3,1) both}
.wl-panel.open{display:block}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.wl-handle{width:44px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:0 auto 16px}
.wl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.wl-head h3{font-size:18px;font-weight:900}
.wl-filters{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.wl-filters::-webkit-scrollbar{display:none}
.wl-chip{padding:7px 12px;border-radius:9px;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);white-space:nowrap;transition:.15s}
.wl-chip.active{background:var(--accent-2);color:#fff;border-color:transparent}
.wl-item{display:flex;gap:12px;padding:10px;border-radius:12px;align-items:center;transition:.15s;cursor:pointer}
.wl-item:hover{background:rgba(255,255,255,.05)}
.wl-thumb{width:48px;height:68px;border-radius:8px;flex-shrink:0;background:linear-gradient(150deg,var(--panel),#0a0a0a);overflow:hidden;position:relative}
.wl-thumb img{width:100%;height:100%;object-fit:cover}
.wl-info{flex:1;min-width:0}
.wl-info strong{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.wl-info span{font-size:11.5px;color:var(--muted)}

.auth-shell{max-width:420px;margin:0 auto;background:var(--bg-2);border:1px solid var(--line-2);border-radius:0;overflow:hidden;animation:rise .3s ease both;padding:34px 30px calc(30px + var(--safe-bottom))}
@media (min-width:720px){.auth-shell{border-radius:var(--radius-lg);padding:34px 34px 34px}}
.auth-brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px}
.auth-brand .mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#09090b;background:linear-gradient(135deg,#fff,var(--accent-2))}
.auth-head{text-align:center;margin-bottom:26px}
.auth-head h2{font-size:24px;font-weight:900;margin-bottom:8px}
.auth-head p{font-size:13.5px;color:var(--muted);line-height:1.5}
.auth-tabs{display:flex;padding:5px;gap:4px;background:var(--panel);border-radius:12px;border:1px solid var(--line);margin-bottom:22px}
.auth-tabs button{flex:1;padding:11px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);transition:.2s}
.auth-tabs button.active{color:#09090b;background:#fff}
.auth-field{display:block;margin-bottom:16px}
.auth-field > span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.auth-field input{width:100%;padding:14px 16px;border-radius:11px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:15px;outline:none;transition:.2s}
.auth-field input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(167,139,250,.12)}
.auth-submit{width:100%;justify-content:center;padding:15px;font-size:15px;margin-top:8px}
.auth-error{margin-top:14px;padding:12px 14px;border-radius:11px;font-size:13px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5;line-height:1.5}
.auth-error[hidden]{display:none !important}
.auth-demo{margin-top:16px;padding:12px;border-radius:11px;background:rgba(167,139,250,.08);border:1px dashed rgba(167,139,250,.35);font-size:12.5px;color:#d0d0d8;text-align:center}
.auth-demo button{margin-left:8px;padding:5px 10px;border-radius:7px;background:var(--accent-2);color:#fff;font-weight:800;font-size:11px;min-height:auto}

.search-overlay-inner{padding:calc(16px + var(--safe-top)) 20px 24px;max-width:900px;margin:0 auto}

function addToHistory(item) {
  history = history.filter(h => h.id !== item.id);

  if (history.length > 100) history = history.slice(0, 100);

}

function getHistory(type) {
  if (!type || type === 'all') return history;
  return history.filter(h => h.type === type);

function clearHistory() {

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  if (d < 7) return d + 'd ago';
  const w = Math.floor(d / 7);
  if (w < 5) return w + 'w ago';
  return Math.floor(d / 30) + 'mo ago';
}

const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const typeOf = i => TYPES[i.type]||{label:'?',icon:'❓',verb:'Open'};
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hue = s => { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return h; };
const slug = s => String(s||'anime').toLowerCase().replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-').replace(/-+/g,'-');
const initials = n => {const p=String(n||'?').trim().split(/\s+/);return p.length===1?p[0].slice(0,2).toUpperCase():(p[0][0]+p[p.length-1][0]).toUpperCase()};
const isIndian = i => i.originCountry==='IN';

function toast(msg){
  const t = $('#toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ══════════════════════════════════════════════════════════════
   API LAYER
   ══════════════════════════════════════════════════════════════ */
async function api(path, params = {}) {
  const u = new URL(API + path);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  const r = await fetchT(u.toString(), {}, 12000);
  if (!r.ok) throw new Error('API ' + r.status);
  return r.json();
}

function normTMDB(r, type) {
  const t = r.title || r.name || 'Untitled';
  return {
    id: 'tmdb_' + type + '_' + r.id, source: 'tmdb', sourceId: r.id, type, title: t,
    year: parseInt((r.release_date || r.first_air_date || '').slice(0, 4)) || '—',
    rating: Math.round((r.vote_average || 0) * 10) / 10,
    desc: r.overview || 'No description available.',
    poster: r.poster_path ? 'https://image.tmdb.org/t/p/w500' + r.poster_path : null,
    backdrop: r.backdrop_path ? 'https://image.tmdb.org/t/p/w1280' + r.backdrop_path : null,
    genres: [], hue: hue(t), originCountry: (r.origin_country || [])[0] || null
  };
}

function normAnime(m) {
  const t = m.title?.english || m.title?.romaji || m.title?.native || 'Untitled';
  return {
    id: 'anilist_anime_' + m.id, source: 'anilist', sourceId: m.id, type: 'anime', title: t,
    year: m.startDate?.year || '—', rating: m.averageScore ? Math.round(m.averageScore) / 10 : 0,
    desc: String(m.description || '').replace(/<[^>]*>/g, '').slice(0, 400),
    poster: m.coverImage?.large || m.coverImage?.medium || null, backdrop: m.bannerImage || null,
    genres: (m.genres || []).slice(0, 8), episodes: m.episodes || 12, hue: hue(t)
  };
}

function normMangaItem(m) {
  const t = m.title?.english || m.title?.romaji || m.title?.native || 'Untitled';
  return {
    id: 'anilist_' + m.id, source: 'anilist', sourceId: m.id, type: 'manga', title: t,
    year: m.startDate?.year || '—', rating: m.averageScore ? Math.round(m.averageScore) / 10 : 0,
    desc: String(m.description || '').replace(/<[^>]*>/g, '').slice(0, 400),
    poster: m.coverImage?.large || m.coverImage?.medium || null, genres: (m.genres || []).slice(0, 8), hue: hue(t)
  };
}

async function tmdbMovies(p = 1) { const d = await api('/api/movie/trending', { page: p }); return (d.results || []).map(m => normTMDB(m, 'movie')); }
async function tmdbTV(p = 1) { const d = await api('/api/tv/trending', { page: p }); return (d.results || []).map(m => normTMDB(m, 'tv')); }
async function tmdbTopRated(p = 1) { const d = await api('/api/movie/trending', { page: p }); return (d.results || []).map(m => normTMDB(m, 'movie')); }
async function tmdbIndianM(p = 1) { const d = await api('/api/movie/indian'); return (d.results || []).map(m => normTMDB(m, 'movie')); }
async function tmdbIndianT(p = 1) { return []; }
async function tmdbSearch(q) { const d = await api('/api/search', { q }); return (d.results || []).filter(r => r.media_type === 'movie' || r.media_type === 'tv').map(r => normTMDB(r, r.media_type)); }

async function animeTop(p = 1) { const d = await api('/api/anime/trending', { page: p }); return (d.results || []).map(normAnime); }
async function animeSearch(q) { const d = await api('/api/anime/search', { q }); return (d.results || []).map(normAnime); }

async function mangaTop() {
  const d = await fetchT('https://graphql.anilist.co', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query: `query{Page(page:1,perPage:24){media(type:MANGA,sort:POPULARITY_DESC){id title{romaji english native}coverImage{large medium}description chapters averageScore startDate{year}genres}}}` })
  }, 8000).then(r => r.json());
  return (d.data.Page?.media || []).map(normMangaItem);
}
async function mangaSearch(q) {
  const d = await fetchT('https://graphql.anilist.co', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query: `query($s:String){Page(page:1,perPage:24){media(type:MANGA,search:$s){id title{romaji english native}coverImage{large medium}description chapters averageScore startDate{year}genres}}}`, variables: { s: q } })
  }, 8000).then(r => r.json());
  return (d.data.Page?.media || []).map(normMangaItem);
}

function cardHTML(item, progress){

  if(isIndian(item)){ bcls='indian'; badge='🇮🇳'; }
  const poster = item.poster
    ? `<img src="${esc(item.poster)}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="card-initials">${esc(initials(item.title))}</div>`;
  return `<article class="card" data-id="${esc(item.id)}">
    <div class="card-poster">
      ${poster}
      <span class="card-badge ${bcls}">${esc(badge)}</span>
      ${item.rating?`<span class="card-rating">${item.rating}</span>`:''}
      ${progress!=null?`<div class="card-progress"><i style="width:${progress}%"></i></div>`:''}

async function renderGrid(cat){
  const main = $('#main');
  const labels = {
    movie:{title:'Movies',sub:'Browse popular films',icon:'🎬'},
    tv:{title:'TV Shows',sub:'Series & dramas',icon:'📺'},
    anime:{title:'Anime',sub:'Sub · Dub · Hindi',icon:'🌸'},
    manga:{title:'Manga',sub:'Built-in reader · MangaDex',icon:'📖'},
    mine:{title:'My Library',sub:'Your saved titles',icon:'⭐'}
  };
  const L = labels[cat]||{title:'Browse',sub:'',icon:'🌐'};

  // Reset anime page when switching to anime
  if (cat === 'anime') state.animePage = 1;

  // Category-specific history
  const catHistory = cat === 'mine' ? [] : getHistory(cat);
  const historyTitle = cat === 'manga' ? 'Continue Reading' : 'Continue Watching';

  main.innerHTML = `
    <div class="row-head" style="padding-top:20px;margin-bottom:16px">
      <div class="row-head-left">
        <div class="row-kicker">${L.icon} Browse</div>
        <h2 class="row-title">${L.title}</h2>
        <div class="row-sub">${L.sub}</div>
      </div>
    </div>
    ${catHistory.length ? `<div id="catHistorySlot">${historyRowHTML('cat-hist-'+cat, historyTitle, catHistory)}</div>` : ''}
    <div class="grid" id="grid">
      ${Array.from({length:12},()=>'<div class="skeleton"></div>').join('')}
    </div>`;

  try{
    let items = [];
    if(cat==='movie') items = await tmdbMovies().catch(()=>[]);
    else if(cat==='tv') items = await tmdbTV().catch(()=>[]);
    else if(cat==='anime') items = await animeTop(1).catch(()=>[]);
    else if(cat==='manga') items = await mangaTop().catch(()=>[]);
    else if(cat==='mine'){
      items = [...watchlist].map(findById).filter(Boolean);
    }

    if(!items.length && cat!=='mine'){
      items = FALLBACK.filter(i=>{
        if(cat==='movie') return i.type==='movie';
        if(cat==='tv') return i.type==='tv';
        if(cat==='anime') return i.type==='anime';
        if(cat==='manga') return i.type==='manga';
        return false;
      });
      if(items.length) toast('📴 Offline catalog');
    }

    state.allItems = items;
    const grid = $('#grid');
    if(!grid) return;

    if (cat === 'anime') {
      // Anime grid with Load More button
      grid.innerHTML = items.map(i=>cardHTML(i)).join('') +
        `<div style="grid-column:1/-1; text-align:center; padding:20px">
          <button class="btn accent" id="loadMoreAnime">➕ Load More Anime</button>
        </div>`;
      bindLoadMoreAnime();
    } else {
      grid.innerHTML = items.length
        ? items.map(i=>cardHTML(i)).join('')
        : `<div class="empty" style="grid-column:1/-1">
            <span class="big">📭</span>
            <strong>Nothing here yet</strong>
            <p>${cat==='mine'?'Add titles to your list to see them here.':'No content available.'}</p>
          </div>`;
    }
  }catch(err){
    const grid = $('#grid');
    if(grid) grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <span class="big">⚠️</span><strong>Failed to load</strong><p>${esc(err.message)}</p>
    </div>`;
  }
}

function bindLoadMoreAnime() {
  const btn = document.getElementById('loadMoreAnime');
  if (!btn) return;
  btn.onclick = async () => {
    state.animePage++;
    btn.textContent = '⏳ Loading…';
    btn.disabled = true;
    try {
      const d = await api('/api/anime/trending', { page: state.animePage });
      
      // Handle rate limiting or empty response
      if (d.error === 'rate_limited' || !d.results || d.results.length === 0) {
        toast('⏳ Server busy. Please try again in 10 seconds.');
        btn.textContent = '↻ Retry Load More';
        btn.disabled = false;
        return;
      }
      
      const newItems = (d.results || []).map(normAnime);
      state.allItems.push(...newItems);
      const grid = document.getElementById('grid');
      btn.parentElement.remove();
      grid.insertAdjacentHTML('beforeend', newItems.map(i=>cardHTML(i)).join('') +
        `<div style="grid-column:1/-1; text-align:center; padding:20px">
          <button class="btn accent" id="loadMoreAnime">➕ Load More Anime</button>
        </div>`);
      bindLoadMoreAnime();
    } catch(e) {
      toast('⚠ Failed to load more. Please try again.');
      btn.textContent = '↻ Retry Load More';
      btn.disabled = false;
    }
  };
}

   ══════════════════════════════════════════════════════════════ */

const MANGA_PROXIES = [
  u => API + '/proxy?url=' + encodeURIComponent(u)
];

async function proxyJson(url){
  let lastErr;
  for (const build of MANGA_PROXIES){
    try {
      const r = await fetchT(build(url), {}, 12000);
      if (!r.ok){ lastErr = new Error('HTTP '+r.status); continue; }
      const txt = await r.text();
      if (!txt || txt.trim().startsWith('<')){ lastErr = new Error('Bad response (HTML)'); continue; }
      return JSON.parse(txt);
    } catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('All proxies failed. Please try again later.');
}

function imgProxy(url) {
  return API + '/proxy?url=' + encodeURIComponent(url);
}
window.__imgProxy = imgProxy;

async function findMangaDexId(title){
  const cacheKey = 'ns_md_id_' + title.toLowerCase();
  const cached = Store.get(cacheKey);
  if (cached) return cached;
  const url = 'https://api.mangadex.org/manga?limit=1&title=' + encodeURIComponent(title) +
    '&contentRating[]=safe&contentRating[]=suggestive&order[relevance]=desc';
  const data = await proxyJson(url);
  const id = data.data?.[0]?.id;
  if (!id) throw new Error('Manga not found on MangaDex');
  Store.set(cacheKey, id);
  return id;
}

async function fetchMangaChapters(mdId, lang = 'en'){
  const cacheKey = `ns_md_ch_${mdId}_${lang}`;
  const cached = Store.get(cacheKey);
  if (cached) return JSON.parse(cached);

  let allChapters = [];
  let offset = 0;
  const limit = 100; // ⬅️ MangaDex restricts this to 100 when sorting by chapter
  let hasMore = true;

  while (hasMore) {
    // Stop if offset goes beyond MangaDex's 10000 limit
    if (offset >= 10000) {
      hasMore = false;
      break;
    }

    let url = `https://api.mangadex.org/manga/${mdId}/feed?limit=${limit}&offset=${offset}&order[chapter]=asc&contentRating[]=safe&contentRating[]=suggestive&includes[]=scanlation_group`;
    if (lang !== 'all') {
      url += `&translatedLanguage[]=${lang}`;
    }
    
    try {
      const data = await proxyJson(url);
      const chapters = data.data || [];
      if (chapters.length === 0) break;

      allChapters.push(...chapters);
      
      if (chapters.length < limit) {
        hasMore = false;
      } else {
        offset += limit;
      }
    } catch (err) {
      // If we hit an error (like 400), stop looping and keep what we have
      console.log('MangaDex API Error:', err.message);
      hasMore = false;
    }
  }

  const seen = new Set();
  const result = allChapters
    .filter(ch => {
      const k = ch.attributes?.chapter ?? ch.id;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    })
    .map(ch => {
      const isExternal = !!ch.attributes?.externalUrl;
      const scanGroup = ch.relationships?.find(r => r.type === 'scanlation_group')?.attributes?.name || 'Unknown';
      return {
        id: ch.id,
        chapter: ch.attributes?.chapter || '—',
        title: ch.attributes?.title || '',
        pages: ch.attributes?.pages || 0,
        isExternal,
        externalUrl: ch.attributes?.externalUrl,
        lang: ch.attributes?.translatedLanguage,
        group: scanGroup
      };
    });
  
  Store.set(cacheKey, JSON.stringify(result));
  return result;
}

async function fetchMangaPages(chapterId){
  const cacheKey = 'ns_md_pg_' + chapterId;
  const cached = Store.get(cacheKey);
  if (cached) return JSON.parse(cached);

  const url = `https://api.mangadex.org/at-home/server/${chapterId}`;
  const data = await proxyJson(url);
  const base = data.baseUrl;
  const hash = data.chapter.hash;
  const files = data.chapter.data || [];
  if (!files.length) throw new Error('No pages found for this chapter');

  const pages = files.map(f => `${base}/data/${hash}/${f}`);
  Store.set(cacheKey, JSON.stringify(pages));
  return pages;
}

        <button class="chapter-item" data-chapter-id="${esc(ch.id)}" data-external="${ch.isExternal}" data-external-url="${esc(ch.externalUrl||'')}" style="
          display:flex;align-items:center;gap:14px;width:100%;text-align:left;
          padding:14px 16px;border-radius:12px;margin-bottom:8px;
          background:${ch.id===lastRead?'linear-gradient(135deg,rgba(167,139,250,.2),rgba(124,92,255,.1))':'var(--panel)'};
          border:1px solid ${ch.id===lastRead?'var(--accent-2)':'var(--line)'};
          color:var(--text);transition:.15s;cursor:pointer;min-height:auto">
          <span style="font-weight:800;color:var(--accent-2);min-width:56px;font-size:13px">Ch. ${esc(ch.chapter)}</span>
          <span style="flex:1;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
            ${esc(ch.title || 'Chapter ' + ch.chapter)}
            ${ch.isExternal ? '<span style="font-size:11px;color:var(--accent-3);margin-left:6px">🌐 External</span>' : ''}
          </span>
          <span style="font-size:11px;color:var(--muted);flex-shrink:0">${ch.lang?.toUpperCase()}</span>
          <span style="font-size:12px;color:var(--muted);flex-shrink:0">${ch.pages > 0 ? ch.pages + 'p' : '—'}</span>
        </button>
      `).join('') : `
        <div style="padding:60px 20px;text-align:center;color:var(--muted)">
          <div style="font-size:48px;margin-bottom:12px">📭</div>
          <p>No chapters found in this language.</p>
          <p style="font-size:12px;margin-top:8px;color:var(--muted-2)">Try switching to another language from the dropdown above.</p>
        </div>
      `}
    </div>
  </div>`;

  content.querySelector('#mangaBack')?.addEventListener('click', () => {
    document.body.style.overflow='';
    $('#player').classList.remove('open');
  });

  content.querySelector('#mangaLangSelect')?.addEventListener('change', async (e) => {
    currentMangaLang = e.target.value;
    Store.set('ns_manga_lang', currentMangaLang);
    // Show loading
    content.querySelector('#mangaLangSelect').disabled = true;
    try {
      const newChapters = await fetchMangaChapters(item._mdId, currentMangaLang);
      item._chapters = newChapters;
      renderChapterList(item, content);
    } catch(err) {
      toast('⚠ Failed to load chapters in this language');
      content.querySelector('#mangaLangSelect').disabled = false;
    }
  });

  content.querySelectorAll('.chapter-item').forEach(btn => {
    btn.onclick = () => {
      vibrate();
      if (btn.dataset.external === 'true') {
        window.open(btn.dataset.externalUrl, '_blank');
        toast('🌐 Opening external chapter...');
        return;
      }
      loadChapterPages(btn.dataset.chapterId, item, content);
    };
  });
}

async function loadChapterPages(chapterId, item, content){
  const chapters = item._chapters || [];
  const idx = chapters.findIndex(c => c.id === chapterId);
  const ch = chapters[idx] || { chapter:'—' };
  const prev = chapters[idx-1];
  const next = chapters[idx+1];
  const progress = Math.round(((idx + 1) / chapters.length) * 100);

  const topBar = (extra = '') => `
    <div style="padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;backdrop-filter:blur(20px)">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn ghost sm" id="toChapters">←</button>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(item.title)}</div>
          <div style="font-size:11.5px;color:var(--muted)">Ch. ${esc(ch.chapter)}${extra}</div>
        </div>
      </div>
    </div>`;

  content.innerHTML = `<div class="player-shell">
    ${topBar()}
    <div style="display:flex;flex-direction:column;gap:8px;padding:8px 0;background:#000;min-height:60vh;padding-bottom:90px">
      <div style="padding:60px 20px;text-align:center">
        <div style="width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent-2);animation:spin .8s linear infinite;margin:0 auto 14px"></div>
        <p style="color:var(--muted);font-size:13px">Loading pages…</p>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div style="position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--bg-2);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <button class="btn ghost sm" id="botPrevCh" ${prev?'':'disabled style="opacity:.4"'} style="display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:20px;">
        <span>‹</span> Previous
      </button>
      <div style="flex:1;display:flex;justify-content:center;align-items:center;gap:12px;max-width:260px;">
        <select id="botChapterSelect" style="background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 16px;font-size:12px;font-weight:700;outline:none;flex:1;text-align:center;appearance:none;cursor:pointer;">
          ${chapters.map((c, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>Chapter ${c.chapter}${c.title ? ' - ' + c.title : ''}</option>`).join('')}
        </select>
        <span style="font-size:12px;font-weight:800;color:var(--accent-2);white-space:nowrap;">${progress}%</span>
      </div>
      <button class="btn accent sm" id="botNextCh" ${next?'':'disabled style="opacity:.4"'} style="display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:20px;">
        Next <span>›</span>
      </button>
    </div>
  </div>`;

  const bindBar = () => {
    content.querySelector('#toChapters')?.addEventListener('click', () => renderChapterList(item, content));
    content.querySelector('#botPrevCh')?.addEventListener('click', () => { if(prev) loadChapterPages(prev.id, item, content); });
    content.querySelector('#botNextCh')?.addEventListener('click', () => { if(next) loadChapterPages(next.id, item, content); });
    content.querySelector('#botChapterSelect')?.addEventListener('change', (e) => {
      const selectedIdx = parseInt(e.target.value, 10);
      if (chapters[selectedIdx]) loadChapterPages(chapters[selectedIdx].id, item, content);
    });
  };
  bindBar();

  try{
    const pages = await fetchMangaPages(chapterId);
    if (!pages.length) throw new Error('No pages found');
    Store.set('ns_md_last_' + item._mdId, chapterId);

    content.innerHTML = `<div class="player-shell">
      ${topBar(` • ${pages.length} pages`)}
      <div style="display:flex;flex-direction:column;gap:8px;padding:8px 0;background:#000;min-height:60vh;padding-bottom:90px">
        ${pages.map((p, i) => `<img src="${esc(imgProxy(p))}" alt="Page ${i+1}" loading="${i<2?'eager':'lazy'}" referrerpolicy="no-referrer" onerror="this.style.minHeight='200px';this.style.background='#15151a';this.alt='Page ${i+1} failed to load'" style="width:100%;display:block;background:#0a0a0a">`).join('')}
      </div>

      <!-- Bottom Navigation Bar -->
      <div style="position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--bg-2);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <button class="btn ghost sm" id="botPrevCh" ${prev?'':'disabled style="opacity:.4"'} style="display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:20px;">
          <span>‹</span> Previous
        </button>
        <div style="flex:1;display:flex;justify-content:center;align-items:center;gap:12px;max-width:260px;">
          <select id="botChapterSelect" style="background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 16px;font-size:12px;font-weight:700;outline:none;flex:1;text-align:center;appearance:none;cursor:pointer;">
            ${chapters.map((c, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>Chapter ${c.chapter}${c.title ? ' - ' + c.title : ''}</option>`).join('')}
          </select>
          <span style="font-size:12px;font-weight:800;color:var(--accent-2);white-space:nowrap;">${progress}%</span>
        </div>
        <button class="btn accent sm" id="botNextCh" ${next?'':'disabled style="opacity:.4"'} style="display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:20px;">
          Next <span>›</span>
        </button>
      </div>
    </div>`;

    bindBar();
  } catch(err){
    content.innerHTML = `<div class="player-shell">
      ${topBar()}
      <div style="padding:60px 20px;text-align:center">
        <div style="font-size:56px;margin-bottom:12px">⚠️</div>
        <h3 style="margin-bottom:10px">Could not load chapter</h3>
        <p style="color:var(--muted);font-size:13.5px;margin-bottom:20px">${esc(err.message)}</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn accent" id="retryChapter">↻ Retry</button>
          <a class="btn ghost" href="https://mangadex.org/chapter/${chapterId}" target="_blank" rel="noopener">🌐 Open on MangaDex</a>
        </div>
      </div>
      <!-- Bottom Navigation Bar for Error State -->
      <div style="position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--bg-2);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <button class="btn ghost sm" id="botPrevCh" ${prev?'':'disabled style="opacity:.4"'} style="display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:20px;">
          <span>‹</span> Previous
        </button>
        <div style="flex:1;display:flex;justify-content:center;align-items:center;gap:12px;max-width:260px;">
          <select id="botChapterSelect" style="background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 16px;font-size:12px;font-weight:700;outline:none;flex:1;text-align:center;appearance:none;cursor:pointer;">
            ${chapters.map((c, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>Chapter ${c.chapter}${c.title ? ' - ' + c.title : ''}</option>`).join('')}
          </select>
          <span style="font-size:12px;font-weight:800;color:var(--accent-2);white-space:nowrap;">${progress}%</span>
        </div>
        <button class="btn accent sm" id="botNextCh" ${next?'':'disabled style="opacity:.4"'} style="display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:20px;">
          Next <span>›</span>
        </button>
      </div>
    </div>`;
    bindBar();
    content.querySelector('#retryChapter')?.addEventListener('click', () => {
      Store.remove('ns_md_pg_' + chapterId);
      loadChapterPages(chapterId, item, content);
    });
  }
}

function renderAuthArea(){
  const box = $('#authArea');
  if(!currentUser){
    box.innerHTML = `<button class="icon-btn" id="openAuth" title="Sign In">👤</button>`;
    $('#openAuth').onclick = () => openAuth('login');
    return;
  }
  const admin = currentUser.email===ADMIN_EMAIL;
  box.innerHTML = `<button class="icon-btn" id="userBtn" title="${esc(currentUser.name)}">
    <span style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:linear-gradient(135deg,var(--accent-2),#7c3aed);color:#fff;${admin?'box-shadow:0 0 0 2px #fbbf24':''}">${initials(currentUser.name)}</span>
  </button>`;
  $('#userBtn').onclick = () => openProfile();
}

function openAuth(tab='login'){
  renderAuthCard(tab);
  $('#authModal').classList.add('open');
  document.body.style.overflow='hidden';
  setTimeout(()=>$('#authContent [name=email]')?.focus(), 100);
}

function renderAuthCard(tab){
  const card = $('#authContent');
  card.innerHTML = `
    <div class="auth-brand">
      <div class="mark">N</div>
      <span style="font-size:19px;font-weight:800">Nexus<em style="color:var(--accent-2);font-style:normal">Stream</em></span>
    </div>
    <div class="auth-head">
      <h2>${tab==='login'?'Welcome Back':'Create Account'}</h2>
      <p>${tab==='login'?'Sign in to sync your library across devices':'Join NexusStream free'}</p>
    </div>
    <div class="auth-tabs">
      <button class="${tab==='login'?'active':''}" data-tab="login">Sign In</button>
      <button class="${tab==='signup'?'active':''}" data-tab="signup">Sign Up</button>
    </div>
    <form id="authForm">
      ${tab==='signup'?`<label class="auth-field"><span>Name</span><input type="text" name="name" placeholder="Your name" required></label>`:''}
      <label class="auth-field"><span>Email</span><input type="email" name="email" placeholder="you@example.com" required></label>
      <label class="auth-field"><span>Password</span><input type="password" name="password" placeholder="••••••••" required></label>
      ${tab==='signup'?`<label class="auth-field"><span>Confirm</span><input type="password" name="confirm" placeholder="Repeat" required></label>`:''}
      <button type="submit" class="btn accent auth-submit">${tab==='login'?'Sign In':'Create Account'}</button>
      <div class="auth-error" id="authErr" hidden></div>
      ${tab==='login'?`<div class="auth-demo">Demo: <strong>demo@nexus.tv</strong> / <strong>Demo@1234</strong><button type="button" id="fillDemo">Fill</button></div>`:''}
    </form>`;

  card.querySelectorAll('[data-tab]').forEach(b=>{
    b.onclick = () => renderAuthCard(b.dataset.tab);
  });
  card.querySelector('#fillDemo')?.addEventListener('click',()=>{
    card.querySelector('[name=email]').value = 'demo@nexus.tv';
    card.querySelector('[name=password]').value = 'Demo@1234';
  });

  card.querySelector('#authForm').onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const err = card.querySelector('#authErr');
    err.hidden = true;
    try{
      if(tab==='login'){
        currentUser = AUTH.login({ email:fd.get('email'), password:fd.get('password') });
        toast('👋 Welcome back, '+currentUser.name.split(' ')[0]+'!');
      } else {
        const pw = String(fd.get('password'));
        if(pw.length<8) throw new Error('Password must be 8+ characters');
        if(pw!==fd.get('confirm')) throw new Error('Passwords do not match');
        const u = AUTH.register({name:fd.get('name'), email:fd.get('email'), password:pw});
        AUTH.session(u);
        currentUser = u;
        toast('🎉 Account created!');
      }
      watchlist = new Set(JSON.parse(Store.get(wlKey())||'[]'));
      history = JSON.parse(Store.get(histKey())||'[]');
      updateWlBadge();
      vibrate(30);
      $('#authModal').classList.remove('open');
      document.body.style.overflow='';
      renderAuthArea();
      if(state.cat==='all') renderHome(); else renderGrid(state.cat);
    }catch(ex){
      err.textContent = '⚠ '+ex.message;
      err.hidden = false;
      vibrate([30,50,30]);
    }
  };
}

      </div>
    </div>`;
  $('#modal').classList.add('open');
  document.body.style.overflow='hidden';
  $('#logoutBtn').onclick = () => {

    watchlist = new Set(JSON.parse(Store.get('ns_wl_g') || '[]'));
    history = JSON.parse(Store.get('ns_hist_g') || '[]');
    updateWlBadge();
    renderAuthArea();
    $('#modal').classList.remove('open');
    document.body.style.overflow='';

function renderWatchlist(){
  const filters = $('#wlFilters');
  const list = $('#wlList');
  const all = [...watchlist].map(findById).filter(Boolean);

  filters.innerHTML = `
    <button class="wl-chip ${state.wlFilter==='all'?'active':''}" data-wlf="all">All ${all.length}</button>
    <button class="wl-chip ${state.wlFilter==='movie'?'active':''}" data-wlf="movie">🎬 Movies</button>
    <button class="wl-chip ${state.wlFilter==='tv'?'active':''}" data-wlf="tv">📺 TV</button>
    <button class="wl-chip ${state.wlFilter==='anime'?'active':''}" data-wlf="anime">🌸 Anime</button>
    <button class="wl-chip ${state.wlFilter==='manga'?'active':''}" data-wlf="manga">📖 Manga</button>`;
  filters.querySelectorAll('[data-wlf]').forEach(b=>{
    b.onclick = () => { state.wlFilter = b.dataset.wlf; renderWatchlist(); };
  });

  let items = all;
  if(state.wlFilter!=='all') items = all.filter(i=>i.type===state.wlFilter);

  list.innerHTML = items.length
    ? items.map(i=>`<div class="wl-item" data-id="${esc(i.id)}">
        <div class="wl-thumb">${i.poster?`<img src="${esc(i.poster)}" alt="" loading="lazy">`:typeOf(i).icon}</div>
        <div class="wl-info">
          <strong>${esc(i.title)}</strong>
          <span>${i.year} • ${typeOf(i).label}${i.rating?` • ★ ${i.rating}`:''}</span>
        </div>
      </div>`).join('')
    : `<div style="padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px">${all.length?'Nothing in this filter.':'Your list is empty. Tap ★ on any title to save it.'}</div>`;
  list.querySelectorAll('[data-id]').forEach(el=>{
    el.onclick = () => { toggleWlPanel(); openDetail(el.dataset.id); };
  });
}
function toggleWlPanel(){
  const p = $('#wlPanel');
  p.classList.toggle('open');
  if(p.classList.contains('open')) renderWatchlist();
}

document.addEventListener('click', e => {
  const nav = e.target.closest('.bn-item[data-cat]');
  if(nav){
    vibrate();
    const cat = nav.dataset.cat;
    $$('.bn-item').forEach(b=>b.classList.toggle('active',b===nav));
    state.cat = cat;
    state.allItems = [];
    if(cat==='all') renderHome();
    else renderGrid(cat);
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }

  const scrollBtn = e.target.closest('[data-scroll]');
  if(scrollBtn){
    const rowId = scrollBtn.dataset.target;
    const scroll = document.getElementById('scroll-'+rowId);
    if(scroll){
      const amount = scroll.clientWidth * 0.8;
      scroll.scrollBy({left: scrollBtn.dataset.scroll==='left'?-amount:amount, behavior:'smooth'});
    }
    return;
  }

  const card = e.target.closest('.card[data-id]');
  if(card && !e.target.closest('[data-play]')){
    if(card.dataset.resume === 'true'){
      openPlayer(card.dataset.id);
    } else {
      openDetail(card.dataset.id);
    }
    return;
  }

  const play = e.target.closest('[data-play]');
  if(play){ openPlayer(play.dataset.play); return; }

  const wl = e.target.closest('[data-watch]');
  if(wl){
    if(!currentUser){ openAuth('login'); return; }
    const id = wl.dataset.watch;
    if(watchlist.has(id)){watchlist.delete(id);toast('Removed from My List');}
    else {watchlist.add(id);toast('Added to My List ✓');}
    saveWL(); vibrate();
    if($('#modal').classList.contains('open')) openDetail(id);
    return;
  }

  const det = e.target.closest('[data-detail]');
  if(det){ openDetail(det.dataset.detail); return; }

  if(e.target.closest('#mobileSearch')){ openSearchOverlay(); return; }
  if(e.target.closest('#settingsBtn')){ openSettings(); return; }
  if(e.target.closest('#fabWatch')){ vibrate(); toggleWlPanel(); return; }

  const close = e.target.closest('[data-close]');
  if(close){
    const ov = close.closest('.overlay') || close.closest('#player');
    if(ov){ ov.classList.remove('open'); document.body.style.overflow=''; }
    return;
  }
  if(e.target.classList.contains('overlay')){
    e.target.classList.remove('open');
    document.body.style.overflow='';
    return;
  }
});

function openSearchOverlay(){
  $('#searchOverlay').classList.add('open');
  document.body.style.overflow='hidden';
  setTimeout(()=>$('#searchOverlayInput')?.focus(), 100);
}

let quickTimer;
document.addEventListener('input', e => {
  if(e.target.id==='quickSearch'){
    clearTimeout(quickTimer);
    const q = e.target.value.trim();
    if(!q) return;
    quickTimer = setTimeout(()=>{
      openSearchOverlay();
      const inp = $('#searchOverlayInput');
      if(inp){ inp.value = q; renderSearch(q); }
    }, 400);
  }
  if(e.target.id==='searchOverlayInput'){
    clearTimeout(quickTimer);
    const q = e.target.value.trim();
    quickTimer = setTimeout(()=>renderSearch(q), 300);
  }
});

function boot(){
  renderAuthArea();
  renderHome();
}
boot();
</script>
